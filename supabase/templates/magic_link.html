<!-- Sign-in code email (Supabase "Magic Link" template). Shows the 6-digit code, in English and Arabic. -->
<div style="font-family:Arial,sans-serif;color:#3A1328;line-height:1.5;max-width:480px">
  <p style="margin:0 0 12px">Your BrightSmile sign-in code:</p>
  <p style="margin:0 0 16px">
    <strong style="font-size:28px;letter-spacing:6px;background:#F9D5DC;padding:6px 14px;border-radius:8px">{{ .Token }}</strong>
  </p>
  <p style="margin:0 0 20px;color:#6b5560;font-size:13px">It expires in 1 hour. If you didn't ask for it, you can ignore this email.</p>

  <div dir="rtl" lang="ar" style="border-top:1px solid #F9D5DC;padding-top:16px">
    <p style="margin:0 0 12px">رمز تسجيل الدخول إلى برايت سمايل:</p>
    <p style="margin:0 0 16px">
      <strong style="font-size:28px;letter-spacing:6px;background:#F9D5DC;padding:6px 14px;border-radius:8px">{{ .Token }}</strong>
    </p>
    <p style="margin:0;color:#6b5560;font-size:13px">صالح لمدة ساعة. إذا لم تطلبه، تجاهل هذه الرسالة.</p>
  </div>
</div>
