# Render Blueprint: backend API + private LLM engine in one free web service.
services:
  - type: web
    name: brightsmile-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - infra/render/**
    envVars:
      - key: FREEAPI_CONFIG_JSON
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Admin door to the private LLM engine dashboard (see backend/src/middlewares/llmAdminDoor.js)
      - key: LLM_ADMIN_DOOR_KEY
        sync: false
      # Encrypted engine DB backup (keeps dashboard changes across restarts)
      - key: ENCRYPTION_KEY
        sync: false
      - key: FREEAPI_DB_BACKUP_TARGET
        sync: false
      - key: FREEAPI_DB_BACKUP_TOKEN
        sync: false
      - key: FREEAPI_DB_BACKUP_INTERVAL_MS
        sync: false
      # Database (Supabase). The server refuses to start in production without the first four.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Fingerprints personal sign-in codes (min 32 chars); changing it invalidates issued codes
      - key: PERSONAL_CODE_SECRET
        sync: false
      # Email: log (default) | smtp | brevo — see backend/.env.example
      - key: EMAIL_PROVIDER
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: APP_URL
        sync: false
